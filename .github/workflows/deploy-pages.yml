name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Ajustar enlaces para GitHub Pages
        run: |
          sed -i 's|href="/catalogo"|href="catalogo"|g' src/app/app.html src/app/inicio/inicio.html
          sed -i 's|href="/promociones"|href="promociones"|g' src/app/app.html
          sed -i 's|href="/contacto"|href="contacto"|g' src/app/app.html
          sed -i 's|href="/"|href="./"|g' src/app/app.html

      - name: Construir página
        run: npx ng build --configuration production --base-href /licoreria-de-baco-tb1/ --output-mode static

      - name: Preparar rutas internas
        run: cp dist/proyectoparcialdesarrolloweb/browser/index.html dist/proyectoparcialdesarrolloweb/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/proyectoparcialdesarrolloweb/browser

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
