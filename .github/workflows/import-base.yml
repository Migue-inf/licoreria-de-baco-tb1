name: Importar base del proyecto

on:
  push:
    paths:
      - ".github/workflows/import-base.yml"

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio destino
        uses: actions/checkout@v4

      - name: Descargar proyecto original
        run: git clone --depth 1 https://github.com/alejogzch-afk/proyectoweb1frontendparcial.git proyecto-original

      - name: Copiar archivos base
        run: |
          rsync -a --exclude='.git' --exclude='.github' proyecto-original/ ./
          rm -rf proyecto-original

      - name: Guardar archivos importados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: importar estructura original del proyecto" || exit 0
          git push
