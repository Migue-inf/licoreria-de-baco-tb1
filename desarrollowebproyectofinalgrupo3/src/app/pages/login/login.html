<main>
  <section class="seccion-login">
    <div class="container">
      <div class="card-login mx-auto">
        <div class="text-center mb-4">
          <img src="/assets/img/LogoOficial_debaco.jpeg" alt="Logo Licorería de Baco" class="login-logo">
          <h1 class="h3 titulo-login mt-3">Iniciar sesión</h1>
          <p class="subtitulo-login">Accede a tu cuenta para gestionar tus pedidos.</p>
        </div>

        <form (ngSubmit)="iniciarSesion()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
              id="email"
              type="email"
              class="form-control input-baco"
              placeholder="tu&#64;correo.com"
              [(ngModel)]="email"
              name="email"
              required
            >
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              id="contrasena"
              type="password"
              class="form-control input-baco"
              placeholder="••••••••"
              [(ngModel)]="contrasena"
              name="contrasena"
              required
            >
          </div>

          <div class="alerta mb-3" *ngIf="mensaje" [class.alerta-error]="tipoMensaje === 'error'" [class.alerta-exito]="tipoMensaje === 'exito'">
            {{ mensaje }}
          </div>

          <button class="btn btn-vino w-100 btn-lg" type="submit" [disabled]="enviando">
            {{ enviando ? 'Ingresando...' : 'Iniciar sesión' }}
          </button>
        </form>

        <p class="text-center mt-4 mb-0 enlace-registro">
          ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </section>
</main>
