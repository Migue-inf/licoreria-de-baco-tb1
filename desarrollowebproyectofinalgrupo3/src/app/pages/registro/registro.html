<main>
  <section class="seccion-registro">
    <div class="container">
      <div class="card-registro mx-auto">
        <div class="text-center mb-4">
          <img src="/assets/img/LogoOficial_debaco.jpeg" alt="Logo Licorería de Baco" class="registro-logo">
          <h1 class="h3 titulo-registro mt-3">Crear una cuenta</h1>
          <p class="subtitulo-registro">Regístrate para seguir tus pedidos y acceder a ofertas exclusivas.</p>
        </div>

        <form (ngSubmit)="crearCuenta()" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input
              id="nombre"
              type="text"
              class="form-control input-baco"
              placeholder="Juan Pérez"
              [(ngModel)]="nombre"
              name="nombre"
              required
            >
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
              id="email"
              type="email"
              class="form-control input-baco"
              placeholder="tu&#64;correo.com"
              [(ngModel)]="email"
              name="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input
              id="fechaNacimiento"
              type="date"
              class="form-control input-baco"
              [(ngModel)]="fechaNacimiento"
              name="fechaNacimiento"
              required
            >
            <small class="text-muted">Debes ser mayor de 18 años para registrarte.</small>
          </div>

          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              id="contrasena"
              type="password"
              class="form-control input-baco"
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="contrasena"
              name="contrasena"
              required
            >
          </div>

          <div class="mb-4">
            <label for="confirmar" class="form-label">Confirmar contraseña</label>
            <input
              id="confirmar"
              type="password"
              class="form-control input-baco"
              placeholder="Repite tu contraseña"
              [(ngModel)]="confirmar"
              name="confirmar"
              required
            >
          </div>

          <div class="alerta mb-3" *ngIf="mensaje" [class.alerta-error]="tipoMensaje === 'error'" [class.alerta-exito]="tipoMensaje === 'exito'">
            {{ mensaje }}
          </div>

          <button class="btn btn-vino w-100 btn-lg" type="submit" [disabled]="enviando">
            {{ enviando ? 'Creando cuenta...' : 'Crear cuenta' }}
          </button>
        </form>

        <p class="text-center mt-4 mb-0 enlace-login">
          ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </p>
      </div>
    </div>
  </section>
</main>
